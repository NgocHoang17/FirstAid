name: mobile
description: "FirstAid offline first-aid reference app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.2
  dio: ^5.11.1
  equatable: ^3.0.0
  url_launcher: ^6.3.3
  sqflite: ^2.4.6
  connectivity_plus: ^7.3.2
  image_picker: ^1.2.4

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/content/reference_library.json
    - assets/content/offline_snapshot.json
    - assets/illustrations/
    - assets/brand/learning-kit.webp
  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
