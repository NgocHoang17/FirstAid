spring.application.name=firstAid
server.error.include-message=never
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/firstaid}
spring.datasource.username=${DB_USER:firstaid}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
spring.sql.init.mode=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
logging.level.root=INFO
logging.level.org.springframework.jdbc=INFO
firstaid.cors.allowed-origin=${ADMIN_ORIGIN:http://localhost:3000}
firstaid.public.locale=${PUBLIC_LOCALE:vi-VN}
firstaid.public.region-code=${PUBLIC_REGION:}
firstaid.public.emergency-number=${EMERGENCY_NUMBER:}
firstaid.ai.base-url=${AI_BASE_URL:}
firstaid.ai.internal-token=${AI_INTERNAL_TOKEN:}
